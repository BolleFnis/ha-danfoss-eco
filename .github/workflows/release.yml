name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest=custom_components/danfoss_eco/manifest.json
          jq --arg v "${TAG#v}" '.version = $v' "$manifest" > tmp && mv tmp "$manifest"
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git commit -am "chore: set manifest version to $TAG" || exit 0
          git tag -f "$TAG"
          git push origin -f "$TAG"
